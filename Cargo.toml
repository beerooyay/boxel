[package]
name = "boxel"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Certified-locality diffusive fields: cost and memory follow what happens, not the size of the world."
repository = "https://github.com/beerooyay/boxel"
keywords = ["simulation", "diffusion", "gamedev", "no-std", "certified"]
categories = ["game-development", "simulation", "no-std"]

[workspace]
members = ["ffi", "bench"]
exclude = ["integrations/bevy"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
