name: Publish Tarn

on:
  push:
    branches: [main]
    paths: ['demo/**', 'src/**', 'ffi/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build the field engine from this revision and verify its replay
        env:
          RUSTUP_TOOLCHAIN: 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown -p boxel-ffi
          cargo run --locked --release -p boxel-bench -- replay "$RUNNER_TEMP/tarn-replay.json"
          node bench/replay.mjs "$RUNNER_TEMP/tarn-replay.json" target/wasm32-unknown-unknown/release/boxel_ffi.wasm
      - name: Stage the browser demo and its WASM binding
        run: |
          mkdir -p site/ffi site/demo
          rsync -a --exclude=/oak/ --exclude=/oak.js --exclude=/boxel.wasm demo/ site/demo/
          cp target/wasm32-unknown-unknown/release/boxel_ffi.wasm site/demo/boxel.wasm
          cp ffi/boxel.js site/ffi/
          sed 's|src="game.js"|src="./demo/game.js"|' demo/index.html > site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
