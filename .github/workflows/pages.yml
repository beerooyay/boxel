name: Publish Tarnished Promise
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: tarn-packaged-pages
jobs:
  publish:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the verified browser build
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp -R demo ffi index.html .nojekyll "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: publish
        uses: actions/deploy-pages@v5
